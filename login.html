<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PartFind — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f; --surface: #16161a; --surface2: #1e1e24;
            --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
            --accent: #e8ff47; --text: #f0ede8; --muted: rgba(240,237,232,0.45);
            --error: #ff5c5c;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .noise {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-size: 200px;
        }
        .card {
            position: relative; z-index: 1;
            background: var(--surface);
            border: 1px solid var(--border2);
            border-radius: 20px;
            padding: 48px 44px;
            width: 100%; max-width: 400px;
            animation: fadeUp 0.4s ease both;
        }
        @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
        .logo { display:flex; align-items:center; gap:10px; margin-bottom:36px; }
        .logo-mark {
            width:32px; height:32px; background:var(--accent); color:#0d0d0f;
            font-family:'Bebas Neue',sans-serif; font-size:20px;
            display:flex; align-items:center; justify-content:center; border-radius:6px;
        }
        .logo-text { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:.05em; }
        h1 { font-family:'Bebas Neue',sans-serif; font-size:36px; margin-bottom:6px; }
        .subtitle { font-size:14px; font-weight:300; color:var(--muted); margin-bottom:32px; }
        .field { margin-bottom:18px; display:flex; flex-direction:column; gap:6px; }
        label { font-size:10px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
        input {
            padding:12px 14px; font-size:14px; font-family:'DM Sans',sans-serif;
            color:var(--text); background:var(--surface2);
            border:1px solid var(--border2); border-radius:10px; outline:none;
            transition:border-color .15s;
        }
        input:focus { border-color:var(--accent); }
        input::placeholder { color:var(--muted); }
        .btn {
            width:100%; padding:14px; margin-top:8px;
            background:var(--accent); color:#0d0d0f;
            border:none; border-radius:10px;
            font-family:'DM Sans',sans-serif; font-size:15px; font-weight:500;
            cursor:pointer; transition:background .15s, transform .1s;
        }
        .btn:hover { background:#c8dc30; }
        .btn:active { transform:scale(.98); }
        .error-msg {
            font-size:13px; color:var(--error);
            background:rgba(255,92,92,.08); border:1px solid rgba(255,92,92,.2);
            border-radius:8px; padding:10px 14px;
            margin-bottom:16px; display:none;
        }
        .demo-hint {
            margin-top:24px; padding-top:20px; border-top:1px solid var(--border);
            font-size:12px; color:var(--muted); line-height:1.8;
        }
        .demo-hint strong { color:var(--text); font-weight:500; }
        .badge {
            display:inline-block; font-size:10px; font-weight:500;
            padding:2px 7px; border-radius:99px; margin-left:4px;
            vertical-align:middle;
        }
        .badge-user  { background:rgba(56,138,221,.15); color:#85B7EB; }
        .badge-admin { background:rgba(232,255,71,.12); color:var(--accent); }
    </style>
</head>
<body>
<div class="noise"></div>
<div class="card">
    <div class="logo">
        <span class="logo-mark">P</span>
        <span class="logo-text">PartFind</span>
    </div>

    <h1>Welcome back.</h1>
    <p class="subtitle">Sign in to access your parts dashboard.</p>

    <div class="error-msg" id="error-msg">Incorrect username or password. Please try again.</div>

    <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="your username" autocomplete="username">
    </div>
    <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn" id="login-btn">Sign in</button>

    <div class="demo-hint">
        <div>Demo accounts:</div>
        <div><strong>jsmith</strong> / pass1234 <span class="badge badge-user">user</span></div>
        <div><strong>mchen</strong> / secure99 <span class="badge badge-user">user</span></div>
        <div><strong>admin</strong> / admin2025 <span class="badge badge-admin">admin</span></div>
    </div>
</div>

<script src="db.js"></script>
<script>
    // If already logged in, redirect immediately
    const existing = Auth.getSession();
    if (existing) Auth.redirectByRole(existing.role);

    function attemptLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');

        const session = Auth.login(username, password);

        if (session) {
            errorMsg.style.display = 'none';
            Auth.redirectByRole(session.role);
        } else {
            errorMsg.style.display = 'block';
            document.getElementById('password').value = '';
        }
    }

    document.getElementById('login-btn').addEventListener('click', attemptLogin);

    // Allow Enter key to submit
    ['username', 'password'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', e => {
            if (e.key === 'Enter') attemptLogin();
        });
    });
</script>
</body>
</html>
